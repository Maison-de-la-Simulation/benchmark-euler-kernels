---
name: Python checks

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - '.github/workflows/python-checks.yaml'
      - '**.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-format:
    name: Python format using black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: |
          pipx install black~=25.11
      - name: Check format using black
        run: |
          black --line-length 100 --check $(git ls-files '*.py')

  python-lint:
    name: Python lint using pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'
      - run: pip install pandas matplotlib numpy pylint~=4.0
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')
